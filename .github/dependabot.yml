version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # CI's `expo install --check` compares against the newest SDK patches, so an
  # Expo patch release fails every PR until the app catches up. Only Expo's own
  # SDK patches are proposed here; SDK upgrades stay manual via `expo install`.
  - package-ecosystem: npm
    directory: /mobile
    target-branch: development
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
    ignore:
      - dependency-name: "expo*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      expo-sdk-patches:
        patterns:
          - "expo"
          - "expo-*"
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
